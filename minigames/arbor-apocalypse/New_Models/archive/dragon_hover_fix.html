<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inferno Soar - Rigged Animation Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 100, 50, 0.4);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            max-width: 320px;
        }

        .info-panel h1 {
            font-size: 1.4rem;
            color: #ff6b35;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-panel h1::before {
            content: '🐉';
            font-size: 1.5rem;
        }

        .animation-list {
            margin-top: 15px;
        }

        .animation-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(255, 60, 0, 0.1));
            border: 1px solid rgba(255, 107, 53, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .animation-btn:hover {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.4), rgba(255, 60, 0, 0.2));
            border-color: #ff6b35;
            transform: translateX(5px);
        }

        .animation-btn.active {
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            border-color: #ff6b35;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.4);
        }

        .animation-btn .speed {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-left: 5px;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .status-label {
            color: #888;
        }

        .status-value {
            color: #4ade80;
            font-weight: bold;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b35;
            font-size: 1.5rem;
            text-align: center;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 107, 53, 0.3);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 20px;
            color: #aaa;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div id="loading">
            <div class="loader"></div>Loading Rigged Dragon...
        </div>
    </div>
    <div class="info-panel">
        <h1>Inferno Soar</h1>
        <p style="opacity: 0.7; font-size: 0.9rem;">Clean Hover Fix</p>
        <div class="animation-list">
            <button class="animation-btn" data-anim="WingFlap_Normal">🦅 Wing Flap (Normal)</button>
            <button class="animation-btn special" id="hover-attack-btn"
                style="background: linear-gradient(135deg, rgba(255,50,0,0.3), rgba(255,150,0,0.2));">🔥 Hover
                Attack</button>
        </div>
        <div class="status">
            <div><span class="status-label">Playing:</span> <span class="status-value" id="current-anim">None</span>
            </div>
        </div>
    </div>
    <div class="controls-hint">Drag to rotate • Scroll to zoom • Click animation</div>

    <script
        type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(2, 1, 3);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.minDistance = 0.5; controls.maxDistance = 20;

        const ambientLight = new THREE.AmbientLight(0x404060, 0.6); scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffffff, 2); keyLight.position.set(5, 10, 5); scene.add(keyLight);
        scene.add(new THREE.DirectionalLight(0xff6b35, 1).position.set(-5, 5, -5));

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);

        // =====================
        // PARTICLE SYSTEM (Robust Ring Buffer)
        // =====================
        const PARTICLE_COUNT = 4000;
        const fireParticles = {
            active: false,
            geometry: null,
            material: null,
            points: null,
            velocities: [],
            lifetimes: [],
            initialLifetimes: [],
            maxLifetime: 1.2,
            spawnPosition: new THREE.Vector3(0, 0.6, 0.6),
            fireLight: null,
            flickerTime: 0,
            nextSpawnIndex: 0,
            fireBone: null
        };

        function createFireParticles() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const alphas = new Float32Array(PARTICLE_COUNT);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i * 3] = 0; positions[i * 3 + 1] = -1000; positions[i * 3 + 2] = 0;
                colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.8; colors[i * 3 + 2] = 0.3;
                sizes[i] = 0.1; alphas[i] = 0.0;
                fireParticles.velocities.push(new THREE.Vector3());
                fireParticles.lifetimes.push(-1);
                fireParticles.initialLifetimes.push(1.0);
            }

            fireParticles.geometry = new THREE.BufferGeometry();
            fireParticles.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            fireParticles.geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            fireParticles.geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            fireParticles.geometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

            fireParticles.material = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 } },
                vertexShader: `
                    attribute float size; attribute vec3 customColor; attribute float alpha;
                    varying vec3 vColor; varying float vAlpha;
                    void main() {
                        vColor = customColor; vAlpha = alpha;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        float zDepth = max(-mvPosition.z, 0.1); // SAFE CLAMP
                        gl_PointSize = size * (600.0 / zDepth);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor; varying float vAlpha;
                    void main() {
                        vec2 center = gl_PointCoord - vec2(0.5);
                        float dist = length(center);
                        if (dist > 0.5) discard;
                        float intensity = pow(1.0 - (dist * 2.0), 0.8);
                        vec3 finalColor = dist < 0.15 ? mix(vec3(1.0, 1.0, 0.8), vec3(1.0, 0.6, 0.1), dist/0.15) : mix(vec3(1.0, 0.6, 0.1), vec3(0.8, 0.0, 0.0), (dist-0.15)/0.35);
                        gl_FragColor = vec4(finalColor, vAlpha * (dist < 0.15 ? 1.0 : intensity));
                    }
                `,
                transparent: true, blending: THREE.NormalBlending, depthWrite: false
            });

            fireParticles.points = new THREE.Points(fireParticles.geometry, fireParticles.material);
            fireParticles.points.frustumCulled = false;
            scene.add(fireParticles.points);
        }

        function spawnFireParticle(index) {
            const positions = fireParticles.geometry.attributes.position.array;
            const colors = fireParticles.geometry.attributes.customColor.array;
            const alphas = fireParticles.geometry.attributes.alpha.array;
            const sizes = fireParticles.geometry.attributes.size.array;

            const spawnPos = new THREE.Vector3();
            if (fireParticles.fireBone) {
                const boneWorldPos = new THREE.Vector3();
                const boneWorldQuat = new THREE.Quaternion();
                fireParticles.fireBone.getWorldPosition(boneWorldPos);
                fireParticles.fireBone.getWorldQuaternion(boneWorldQuat);

                // Corrected offset based on feedback:
                // X: 0.2 (Horizontal position kept)
                // Y: -0.3 (Distance kept)
                // Z: -0.07 (Raised slightly from -0.15)
                const offset = new THREE.Vector3(0.2, -0.3, -0.07).applyQuaternion(boneWorldQuat);
                spawnPos.copy(boneWorldPos).add(offset);
            } else {
                spawnPos.copy(fireParticles.spawnPosition);
            }

            const spreadX = (Math.random() - 0.5) * 0.1;
            const spreadY = (Math.random() - 0.5) * 0.1;
            positions[index * 3] = spawnPos.x + spreadX;
            positions[index * 3 + 1] = spawnPos.y + spreadY;
            positions[index * 3 + 2] = spawnPos.z;

            const sizeRandom = Math.random();
            const baseSpeed = 4.0 - sizeRandom * 1.5 + Math.random();

            // Standard forward velocity
            fireParticles.velocities[index].set(
                spreadX * 4 + (Math.random() - 0.5) * 0.2,
                spreadY * 4 + (Math.random() - 0.5) * 0.2,
                baseSpeed
            );

            // Diagonal override for hover
            if (fireParticles.diagonalMode) {
                fireParticles.velocities[index].set(
                    spreadX * 3,
                    -baseSpeed * 0.6,  // Down
                    baseSpeed * 0.8    // Forward
                );
            }

            const lifetime = fireParticles.maxLifetime * (0.6 + Math.random() * 0.5);
            fireParticles.lifetimes[index] = lifetime;
            fireParticles.initialLifetimes[index] = lifetime;
            sizes[index] = 0.15 + sizeRandom * 0.1;

            if (Math.random() > 0.7) {
                colors[index * 3] = 1.0; colors[index * 3 + 1] = 1.0; colors[index * 3 + 2] = 0.8;
            } else {
                colors[index * 3] = 1.0; colors[index * 3 + 1] = 0.3 + Math.random() * 0.4; colors[index * 3 + 2] = 0.0;
            }
            alphas[index] = 1.0;
        }

        function updateFireParticles(delta) {
            if (!fireParticles.geometry) return;
            const positions = fireParticles.geometry.attributes.position.array;
            const colors = fireParticles.geometry.attributes.customColor.array;
            const alphas = fireParticles.geometry.attributes.alpha.array;
            const sizes = fireParticles.geometry.attributes.size.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (fireParticles.lifetimes[i] > 0) {
                    fireParticles.lifetimes[i] -= delta;
                    if (fireParticles.lifetimes[i] <= 0) {
                        positions[i * 3 + 1] = -1000; alphas[i] = 0.0; continue;
                    }
                    const vel = fireParticles.velocities[i];
                    positions[i * 3] += vel.x * delta; positions[i * 3 + 1] += vel.y * delta; positions[i * 3 + 2] += vel.z * delta;

                    const lifeRatio = fireParticles.lifetimes[i] / fireParticles.initialLifetimes[i];
                    sizes[i] = 0.15 + 0.35 * (1.0 - lifeRatio);
                }
            }

            if (fireParticles.active) {
                for (let k = 0; k < 60; k++) {
                    fireParticles.nextSpawnIndex = (fireParticles.nextSpawnIndex + 1) % PARTICLE_COUNT;
                    spawnFireParticle(fireParticles.nextSpawnIndex);
                }
            }

            fireParticles.geometry.attributes.position.needsUpdate = true;
            fireParticles.geometry.attributes.customColor.needsUpdate = true;
            fireParticles.geometry.attributes.size.needsUpdate = true;
            fireParticles.geometry.attributes.alpha.needsUpdate = true;
        }

        function startFire(duration = 2.0) {
            fireParticles.active = true;
            fireParticles.flickerTime = 0;

            // INTENSE point light for dramatic fire glow (Restored from working version)
            fireParticles.fireLight = new THREE.PointLight(0xff6600, 8, 4);
            fireParticles.fireLight.position.copy(fireParticles.spawnPosition);
            fireParticles.fireLight.position.z += 0.5;
            scene.add(fireParticles.fireLight);

            // Secondary orange glow
            const glowLight = new THREE.PointLight(0xff2200, 4, 3);
            glowLight.position.copy(fireParticles.spawnPosition);
            scene.add(glowLight);

            setTimeout(() => {
                fireParticles.active = false;
                fireParticles.diagonalMode = false; // Reset mode
                if (fireParticles.fireLight) {
                    scene.remove(fireParticles.fireLight);
                    fireParticles.fireLight = null;
                }
                scene.remove(glowLight);
            }, duration * 1000);
        }

        function startDiagonalFire(duration = 2.0) {
            fireParticles.diagonalMode = true;
            startFire(duration);
        }

        // =====================
        // HOVER SYSTEM (Body Only - No Head Rotation)
        // =====================
        const hoverAttack = { active: false, phase: 'idle', time: 0, originalRotation: null, originalY: 0.5 };

        function startHoverAttack() {
            if (hoverAttack.active) return;
            hoverAttack.active = true; hoverAttack.phase = 'rearing'; hoverAttack.time = 0;
            if (dragonModel) {
                hoverAttack.originalRotation = dragonModel.rotation.x;
                hoverAttack.originalY = dragonModel.position.y;
            }
            document.getElementById('current-anim').textContent = 'Hover Attack!';
        }

        function updateHoverAttack(delta) {
            if (!hoverAttack.active || !dragonModel) return;
            hoverAttack.time += delta;
            const t = hoverAttack.time;

            if (hoverAttack.phase === 'rearing') {
                const rearProgress = Math.min(t / 0.7, 1.0);
                const eased = 1 - Math.pow(1 - rearProgress, 3);
                // Rotate body
                dragonModel.rotation.x = (hoverAttack.originalRotation || 0) - eased * 1.4;
                dragonModel.position.y = hoverAttack.originalY + eased * 0.8;

                // NO JAW ROTATION - Keeps fire orientation safe

                if (rearProgress >= 1.0) {
                    hoverAttack.phase = 'holding'; hoverAttack.time = 0;
                    startDiagonalFire(2.0);
                }
            } else if (hoverAttack.phase === 'holding') {
                const holdProgress = t / 2.0;
                dragonModel.rotation.x = (hoverAttack.originalRotation || 0) - 1.4 + Math.sin(t * 3) * 0.03;
                dragonModel.position.y = hoverAttack.originalY + 0.8 + Math.sin(t * 2) * 0.05;
                if (holdProgress >= 1.0) { hoverAttack.phase = 'returning'; hoverAttack.time = 0; }
            } else if (hoverAttack.phase === 'returning') {
                const returnProgress = Math.min(t / 0.6, 1.0);
                const eased = 1 - Math.pow(1 - returnProgress, 2);
                dragonModel.rotation.x = (hoverAttack.originalRotation || 0) - 1.4 * (1 - eased);
                dragonModel.position.y = hoverAttack.originalY + 0.8 * (1 - eased);
                if (returnProgress >= 1.0) {
                    hoverAttack.active = false; hoverAttack.phase = 'idle';
                    dragonModel.rotation.x = hoverAttack.originalRotation || 0;
                    dragonModel.position.y = hoverAttack.originalY;
                    document.getElementById('current-anim').textContent = 'Hover Attack Complete';
                }
            }
        }

        // LOAD EVERYTHING
        const loader = new GLTFLoader();
        let mixer, dragonModel;
        const animations = {};
        const clock = new THREE.Clock();

        loader.load('./Inferno_Soar_Rigged.glb', (gltf) => {
            document.getElementById('loading').style.display = 'none';
            dragonModel = gltf.scene;
            scene.add(dragonModel);

            // Center
            const box = new THREE.Box3().setFromObject(dragonModel);
            dragonModel.position.sub(box.getCenter(new THREE.Vector3()));
            dragonModel.position.y += 0.5;

            // Find Bone (Tail_3 is the head/mouth in this model)
            dragonModel.traverse((child) => {
                if (child.isBone && child.name === 'Tail_3') {
                    fireParticles.fireBone = child;
                    console.log("Restored Fire Bone Attachment: " + child.name);
                }
            });

            mixer = new THREE.AnimationMixer(dragonModel);
            gltf.animations.forEach((clip) => { animations[clip.name] = clip; });
            animate();

            // Re-enable buttons with FIRE LOGIC RESTORED
            document.querySelectorAll('.animation-btn').forEach(btn => {
                btn.onclick = () => {
                    const name = btn.dataset.anim;
                    if (name) {
                        const action = mixer.clipAction(animations[name]);
                        action.reset().fadeIn(0.2).play();
                        document.getElementById('current-anim').textContent = name;

                        // RESTORED: Trigger fire particles for FireBreath animation
                        if (name === 'FireBreath') {
                            setTimeout(() => {
                                startFire(1.5);
                            }, 800); // Sync delay
                        }
                    }
                }
            });
            document.getElementById('hover-attack-btn').onclick = () => {
                const action = mixer.clipAction(animations['WingFlap_Normal']);
                action.reset().play();
                startHoverAttack();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            updateFireParticles(delta);
            updateHoverAttack(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
