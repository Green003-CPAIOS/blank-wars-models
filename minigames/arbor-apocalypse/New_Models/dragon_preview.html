<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inferno Soar Dragon - Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 100, 50, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            max-width: 300px;
        }

        .info-panel h1 {
            font-size: 1.5rem;
            color: #ff6b35;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }

        .info-panel p {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #ff6b35;
            font-weight: bold;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 15px 30px;
            color: #fff;
            display: flex;
            gap: 30px;
        }

        .control-item {
            text-align: center;
            font-size: 0.85rem;
        }

        .control-key {
            background: rgba(255, 107, 53, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            margin-bottom: 5px;
            display: inline-block;
            font-family: monospace;
        }

        .axis-indicator {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 100px;
            height: 100px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b35;
            font-size: 1.5rem;
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 107, 53, 0.3);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div id="loading">
            <div class="loader"></div>
            Loading Inferno Soar...
        </div>
    </div>

    <div class="info-panel">
        <h1>🐉 Inferno Soar</h1>
        <p>Dragon model preview for rigging planning</p>
        <div style="margin-top: 15px;">
            <div class="stat">
                <span class="stat-label">Vertices</span>
                <span class="stat-value" id="vertex-count">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Triangles</span>
                <span class="stat-value" id="triangle-count">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Bounding Box</span>
                <span class="stat-value" id="bounds">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Center</span>
                <span class="stat-value" id="center">-</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-item">
            <div class="control-key">Drag</div>
            <div>Rotate</div>
        </div>
        <div class="control-item">
            <div class="control-key">Scroll</div>
            <div>Zoom</div>
        </div>
        <div class="control-item">
            <div class="control-key">Shift+Drag</div>
            <div>Pan</div>
        </div>
        <div class="control-item">
            <div class="control-key">R</div>
            <div>Reset View</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1;
        controls.maxDistance = 50;

        // Lighting - dramatic fire-themed
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.position.set(5, 10, 5);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xff6b35, 0.8);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff4500, 0.6);
        rimLight.position.set(0, -5, -10);
        scene.add(rimLight);

        // Ground grid - very fine for small model (0.1 unit squares)
        const gridHelper = new THREE.GridHelper(4, 40, 0x666666, 0x333333); // 4 units wide, 40 divisions = 0.1 per square
        scene.add(gridHelper);

        // Create labeled axis lines
        function createAxisLine(start, end, color) {
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
            return new THREE.Line(geometry, material);
        }

        // Axis lines - scaled for small model
        scene.add(createAxisLine(new THREE.Vector3(-2, 0, 0), new THREE.Vector3(2, 0, 0), 0xff0000)); // X = Red
        scene.add(createAxisLine(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 2, 0), 0x00ff00)); // Y = Green  
        scene.add(createAxisLine(new THREE.Vector3(0, 0, -2), new THREE.Vector3(0, 0, 2), 0x0066ff)); // Z = Blue

        // Create text labels using sprites
        function createTextSprite(text, color, position, size = 0.15) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, 128, 64);

            ctx.font = 'bold 28px Arial';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.copy(position);
            sprite.scale.set(size * 3, size * 1.5, 1);
            return sprite;
        }

        // Axis labels
        scene.add(createTextSprite('X+', '#ff4444', new THREE.Vector3(2.1, 0.1, 0), 0.12));
        scene.add(createTextSprite('X-', '#ff4444', new THREE.Vector3(-2.1, 0.1, 0), 0.12));
        scene.add(createTextSprite('Y+', '#44ff44', new THREE.Vector3(0.15, 2.1, 0), 0.12));
        scene.add(createTextSprite('Z+', '#4488ff', new THREE.Vector3(0, 0.1, 2.1), 0.12));
        scene.add(createTextSprite('Z-', '#4488ff', new THREE.Vector3(0, 0.1, -2.1), 0.12));

        // Fine markers at 0.25 intervals on X axis
        for (let i = -1.75; i <= 1.75; i += 0.25) {
            const label = i.toFixed(2).replace(/\.?0+$/, ''); // Clean up decimals
            if (label === '0') continue;
            scene.add(createTextSprite(label, '#ff8888', new THREE.Vector3(i, 0.02, 0.15), 0.06));
        }

        // Fine markers at 0.25 intervals on Z axis
        for (let i = -1.75; i <= 1.75; i += 0.25) {
            const label = i.toFixed(2).replace(/\.?0+$/, '');
            if (label === '0') continue;
            scene.add(createTextSprite(label, '#88aaff', new THREE.Vector3(0.15, 0.02, i), 0.06));
        }

        // Y axis markers at 0.25 intervals
        for (let i = 0.25; i <= 1.5; i += 0.25) {
            const label = i.toFixed(2).replace(/\.?0+$/, '');
            scene.add(createTextSprite(label, '#88ff88', new THREE.Vector3(0.12, i, 0), 0.06));
        }

        // Add tick marks at 0.5 intervals (more visible)
        for (let i = -1.5; i <= 1.5; i += 0.5) {
            if (Math.abs(i) < 0.1) continue;
            const tickGeo = new THREE.SphereGeometry(0.015);
            const tickMatX = new THREE.MeshBasicMaterial({ color: 0xff4444 });
            const tickMatZ = new THREE.MeshBasicMaterial({ color: 0x4488ff });
            const tickMatY = new THREE.MeshBasicMaterial({ color: 0x44ff44 });

            const tickX = new THREE.Mesh(tickGeo, tickMatX);
            tickX.position.set(i, 0, 0);
            scene.add(tickX);

            const tickZ = new THREE.Mesh(tickGeo, tickMatZ);
            tickZ.position.set(0, 0, i);
            scene.add(tickZ);

            if (i > 0) {
                const tickY = new THREE.Mesh(tickGeo, tickMatY);
                tickY.position.set(0, i, 0);
                scene.add(tickY);
            }
        }

        // Origin marker
        const originGeo = new THREE.SphereGeometry(0.04);
        const originMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const origin = new THREE.Mesh(originGeo, originMat);
        origin.position.set(0, 0, 0);
        scene.add(origin);
        scene.add(createTextSprite('0', '#ffffff', new THREE.Vector3(0.1, 0.05, 0.1), 0.08));

        // Load dragon model
        const loader = new GLTFLoader();
        let dragonModel = null;

        loader.load(
            './Meshy_AI_Inferno_Soar_0126020814_texture.glb',
            (gltf) => {
                document.getElementById('loading').style.display = 'none';

                dragonModel = gltf.scene;
                scene.add(dragonModel);

                // Calculate bounds and center
                const box = new THREE.Box3().setFromObject(dragonModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // Center the model
                dragonModel.position.sub(center);
                dragonModel.position.y += size.y / 2;

                // Update camera to frame the model
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 2);
                controls.target.set(0, size.y / 2, 0);
                controls.update();

                // Count geometry stats
                let vertexCount = 0;
                let triangleCount = 0;

                dragonModel.traverse((child) => {
                    if (child.isMesh && child.geometry) {
                        const geo = child.geometry;
                        if (geo.attributes.position) {
                            vertexCount += geo.attributes.position.count;
                        }
                        if (geo.index) {
                            triangleCount += geo.index.count / 3;
                        } else if (geo.attributes.position) {
                            triangleCount += geo.attributes.position.count / 3;
                        }
                    }
                });

                // Update stats display
                document.getElementById('vertex-count').textContent = vertexCount.toLocaleString();
                document.getElementById('triangle-count').textContent = Math.round(triangleCount).toLocaleString();
                document.getElementById('bounds').textContent =
                    `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
                document.getElementById('center').textContent =
                    `(${center.x.toFixed(1)}, ${center.y.toFixed(1)}, ${center.z.toFixed(1)})`;

                console.log('Dragon loaded!', {
                    size: { x: size.x, y: size.y, z: size.z },
                    center: { x: center.x, y: center.y, z: center.z },
                    vertices: vertexCount,
                    triangles: triangleCount
                });
            },
            (progress) => {
                const pct = (progress.loaded / progress.total * 100).toFixed(0);
                document.getElementById('loading').innerHTML =
                    `<div class="loader"></div>Loading Inferno Soar... ${pct}%`;
            },
            (error) => {
                console.error('Error loading model:', error);
                document.getElementById('loading').innerHTML =
                    `<div style="color: #ff4444;">Error loading model</div>`;
            }
        );

        // Reset view on R key
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && dragonModel) {
                const box = new THREE.Box3().setFromObject(dragonModel);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);

                camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 2);
                controls.target.set(0, size.y / 2, 0);
                controls.update();
            }
        });

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
