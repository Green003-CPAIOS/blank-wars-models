<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roaring Dinosaur - Rigging Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 255, 50, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            max-width: 300px;
        }

        .info-panel h1 {
            font-size: 1.5rem;
            color: #6bff35;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(107, 255, 53, 0.5);
        }

        .info-panel p {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #6bff35;
            font-weight: bold;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 15px 30px;
            color: #fff;
            display: flex;
            gap: 30px;
        }

        .control-item {
            text-align: center;
            font-size: 0.85rem;
        }

        .control-key {
            background: rgba(107, 255, 53, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            margin-bottom: 5px;
            display: inline-block;
            font-family: monospace;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6bff35;
            font-size: 1.5rem;
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(107, 255, 53, 0.3);
            border-top-color: #6bff35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div id="loading">
            <div class="loader"></div>
            Loading Dinosaur...
        </div>
    </div>

    <div class="info-panel">
        <h1>🦖 Roaring Dinosaur</h1>
        <p>Rigging Preview Tool. Use screenshots to identify joint positions.</p>
        <div style="margin-top: 15px;">
            <div class="stat">
                <span class="stat-label">Vertices</span>
                <span class="stat-value" id="vertex-count">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Triangles</span>
                <span class="stat-value" id="triangle-count">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Bounding Box</span>
                <span class="stat-value" id="bounds">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Center</span>
                <span class="stat-value" id="center">-</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-item">
            <div class="control-key">Drag</div>
            <div>Rotate</div>
        </div>
        <div class="control-item">
            <div class="control-key">Scroll</div>
            <div>Zoom</div>
        </div>
        <div class="control-item">
            <div class="control-key">Shift+Drag</div>
            <div>Pan</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x88ff88, 0.5); // Green tint
        fillLight.position.set(-5, 2, -5);
        scene.add(fillLight);

        // Grid & Axes
        const gridHelper = new THREE.GridHelper(4, 40, 0x666666, 0x333333);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        // Labels
        function createTextSprite(text, color, position) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 128, 64);
            ctx.font = 'bold 28px Arial';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 32);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.position.copy(position);
            sprite.scale.set(0.4, 0.2, 1);
            return sprite;
        }
        scene.add(createTextSprite("X (Red)", "#ff8888", new THREE.Vector3(2.2, 0, 0)));
        scene.add(createTextSprite("Y (Green)", "#88ff88", new THREE.Vector3(0, 2.2, 0)));
        scene.add(createTextSprite("Z (Blue)", "#8888ff", new THREE.Vector3(0, 0, 2.2)));

        // Load Dinosaur
        const loader = new GLTFLoader();
        let model = null;

        loader.load('./Meshy_AI_Roaring_Dinosaur_0126033222_texture.glb', (gltf) => {
            document.getElementById('loading').style.display = 'none';
            model = gltf.scene;
            scene.add(model);

            // Center
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);
            model.position.y += size.y / 2; // Sit on floor

            // Camera Fit
            const maxDim = Math.max(size.x, size.y, size.z);
            camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 2);
            controls.target.set(0, size.y / 2, 0);
            controls.update();

            // Stats
            let vCount = 0;
            let tCount = 0;
            model.traverse(c => {
                if (c.isMesh) {
                    vCount += c.geometry.attributes.position.count;
                    if (c.geometry.index) tCount += c.geometry.index.count / 3;
                    else tCount += c.geometry.attributes.position.count / 3;
                }
            });
            document.getElementById('vertex-count').textContent = vCount.toLocaleString();
            document.getElementById('triangle-count').textContent = Math.round(tCount).toLocaleString();
            document.getElementById('bounds').textContent = `${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`;
            document.getElementById('center').textContent = `(${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`;

            console.log("Dinosaur Size:", size);
        }, undefined, (err) => {
            console.error(err);
            document.getElementById('loading').innerHTML = "Error loading model!";
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
